# Konfiguracja projektu: Modelowanie trajektorii uczenia się w LMS

project:
  name: "lms-learning-trajectory-lstm"
  seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  dataset_url: "https://zenodo.org/records/14003233" # OULAD dataset
  tables:
    - "courses.csv"
    - "assessments.csv"
    - "vle.csv"
    - "studentInfo.csv"
    - "studentRegistration.csv"
    - "studentAssessment.csv"
    - "studentVle.csv"

features:
  time_granularity: "daily" # 'daily' lub 'weekly'
  sequence_max_length: 100  # Maksymalna długość sekwencji (dni aktywności)
  prediction_horizon_days: 7 # Horyzont predykcji porzucenia kursu
  selected_activities:
    - "oucontent"
    - "forumng"
    - "quiz"
    - "resource"
    - "subpage"
    - "url"

models:
  baseline:
    type: "random_forest"
    n_estimators: 100
    max_depth: 10
  
  rnn:
    type: "lstm" # 'lstm' lub 'gru'
    input_dim: 12
    hidden_dim: 64
    num_layers: 2
    dropout: 0.3
    bidirectional: false
    learning_rate: 0.001
    batch_size: 64
    epochs: 30
    early_stopping_patience: 5

interpretability:
  min_dropout_sequence_gap: 5 # Liczba dni bez aktywności definiująca załamanie
