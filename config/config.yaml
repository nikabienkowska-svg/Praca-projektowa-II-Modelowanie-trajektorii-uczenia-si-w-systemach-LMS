# Konfiguracja projektu: Predykcja polaryzacji postawy i zmiana zdania (Webis-CMV-20 / BERT)

project:
  name: "cmv-belief-evolution-bert"
  category: "6. Transformery (Attention / BERT / GPT)"
  seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  dataset_zenodo_url: "https://zenodo.org/records/3778298"
  pairs_raw: "data/raw/pairs.jsonl.bz2"
  author_liwc_raw: "data/raw/author_liwc.jsonl.bz2"
  clean_sample_path: "data/processed/cmv_persuasion_pairs_sample.jsonl"
  max_sample_pairs: 1000

features:
  embedding_model_name: "sentence-transformers/all-MiniLM-L6-v2"
  max_token_length: 512
  hedging_markers:
    - "perhaps"
    - "maybe"
    - "i admit"
    - "you have a point"
    - "i had not considered"
    - "i might be wrong"
    - "fair point"
    - "concede"
  certainty_markers:
    - "definitely"
    - "obviously"
    - "undeniably"
    - "impossible"
    - "never"
    - "always"
    - "fact"

models:
  baseline:
    tfidf_max_features: 5000
    classifier: "random_forest"
  
  transformer:
    pretrained_model_name: "bert-base-uncased"
    batch_size: 16
    learning_rate: 0.00002 # 2e-5
    weight_decay: 0.01
    epochs: 3
    warmup_ratio: 0.1
    eval_steps: 100

gradio_demo:
  port: 7860
  share: false
